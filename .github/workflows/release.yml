name: release native matrix

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  NIF_VERSION: "2.15"
  RUST_TOOLCHAIN: "1.89.0"

jobs:
  source-qa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.20.1"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          components: rustfmt, clippy
      - run: mix deps.get
      - run: RUSTY_OPUS_BUILD=1 bin/qa_check.sh

  native:
    needs: source-qa
    name: NIF 2.15 / ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-15
            builder: native
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            builder: native
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            builder: container
            image: "rust:1.89.0-bullseye"
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            builder: container
            image: "rust:1.89.0-alpine3.22"
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            builder: container
            image: "rust:1.89.0-bullseye"
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            builder: container
            image: "rust:1.89.0-alpine3.22"
    steps:
      - uses: actions/checkout@v6

      - name: Resolve project version
        shell: bash
        run: |
          VERSION=$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs | head -1)
          test -n "$VERSION"
          echo "PROJECT_VERSION=$VERSION" >> "$GITHUB_ENV"

      - if: ${{ !contains(matrix.target, 'musl') }}
        uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.20.1"

      - name: Cache Cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/rusty_opus_native/target
          key: precompiled-${{ matrix.target }}-nif${{ env.NIF_VERSION }}-${{ hashFiles('native/rusty_opus_native/Cargo.lock', 'native/rusty_opus_native/Cargo.toml', 'native/rusty_opus_native/src/**/*.rs', '.cargo/config.toml') }}

      - name: Install pinned Rust toolchain
        if: matrix.builder == 'native'
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
          targets: ${{ matrix.target }}

      - name: Build native artifact
        if: matrix.builder == 'native'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUSTLER_NIF_VERSION: ${{ env.NIF_VERSION }}
        run: |
          cargo +1.89.0 build --release --locked --target "$TARGET" \
            --manifest-path native/rusty_opus_native/Cargo.toml

      - name: Package native artifact
        if: matrix.builder == 'native'
        id: native
        shell: bash
        run: bin/package_precompiled_nif.sh "$PROJECT_VERSION" "$NIF_VERSION" "${{ matrix.target }}"

      - name: Build Linux artifact in matching container
        if: matrix.builder == 'container'
        shell: bash
        env:
          IMAGE: ${{ matrix.image }}
          TARGET: ${{ matrix.target }}
          RUSTLER_NIF_VERSION: ${{ env.NIF_VERSION }}
        run: |
          mkdir -p "$HOME/.cargo/registry" "$HOME/.cargo/git"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cargo/registry:/usr/local/cargo/registry" \
            -v "$HOME/.cargo/git:/usr/local/cargo/git" \
            -w /work/native/rusty_opus_native \
            -e TARGET="$TARGET" \
            -e RUSTLER_NIF_VERSION="$RUSTLER_NIF_VERSION" \
            -e CARGO_INCREMENTAL=0 \
            -e CARGO_TARGET_DIR="/work/native/rusty_opus_native/target/$TARGET" \
            "$IMAGE" sh -c '
              set -eu
              if test -f /etc/alpine-release; then
                apk add --no-cache build-base linux-headers
              else
                apt-get update
                apt-get install -y --no-install-recommends build-essential pkg-config
                rm -rf /var/lib/apt/lists/*
              fi
              rustc -vV | grep -q "^host: $TARGET$"
              # Native build inside the matching image (do not pass --target).
              cargo build --locked --release
            '
          sudo chown -R "$(id -u):$(id -g)" "native/rusty_opus_native/target/$TARGET"

      - name: Package Linux artifact
        if: matrix.builder == 'container'
        id: linux
        shell: bash
        env:
          CARGO_TARGET_DIR: native/rusty_opus_native/target/${{ matrix.target }}
        run: bin/package_precompiled_nif.sh "$PROJECT_VERSION" "$NIF_VERSION" "${{ matrix.target }}"

      - name: Select artifact outputs
        id: artifact
        shell: bash
        env:
          NATIVE_NAME: ${{ steps.native.outputs.file-name }}
          NATIVE_PATH: ${{ steps.native.outputs.file-path }}
          LINUX_NAME: ${{ steps.linux.outputs.file-name }}
          LINUX_PATH: ${{ steps.linux.outputs.file-path }}
        run: |
          name="${NATIVE_NAME:-$LINUX_NAME}"
          path="${NATIVE_PATH:-$LINUX_PATH}"
          test -n "$name" && test -f "$path"
          mkdir -p raw-smoke
          tar -xzf "$path" -C raw-smoke
          test "$(find raw-smoke -type f | wc -l | tr -d ' ')" = 1
          echo "file-name=$name" >> "$GITHUB_OUTPUT"
          echo "file-path=$path" >> "$GITHUB_OUTPUT"
          echo "nif-path=$(find "$PWD/raw-smoke" -type f -print -quit)" >> "$GITHUB_OUTPUT"

      - name: Raw smoke native/glibc artifact
        if: ${{ !contains(matrix.target, 'musl') }}
        shell: bash
        env:
          NIF_PATH: ${{ steps.artifact.outputs.nif-path }}
          PROJECT_VERSION: ${{ env.PROJECT_VERSION }}
        run: elixir bin/smoke_precompiled_nif.exs

      - name: Mix API smoke (macOS native only)
        if: matrix.builder == 'native'
        shell: bash
        env:
          ARCHIVE: ${{ steps.artifact.outputs.file-path }}
          MIX_ENV: test
        run: |
          mix deps.get
          RUSTY_OPUS_BUILD=1 mix compile
          rm -rf /tmp/rusty_opus-artifact
          mkdir -p /tmp/rusty_opus-artifact priv/native
          tar -xzf "$ARCHIVE" -C /tmp/rusty_opus-artifact
          library=$(find /tmp/rusty_opus-artifact -type f \( -name '*.so' -o -name '*.dylib' \) | head -n 1)
          test -n "$library"
          rm -f priv/native/*
          cp "$library" priv/native/librusty_opus_native.so
          mix run --no-compile --no-start -e '
            {:ok, _} = RustyOpus.native_smoke()
            pcm = RustyOpus.TestHelpers.PCM.sine(16_000, 1, 0.02)
            {:ok, packet} = RustyOpus.encode_pcm(pcm, 16_000, 1, bitrate: 24_000)
            {:ok, decoded} = RustyOpus.decode_packet(packet, 16_000, 1, 320)
            true = byte_size(decoded) == 320 * 4
            IO.puts("artifact-smoke-ok")
          '

      - name: Raw smoke musl artifact in Alpine Elixir
        if: contains(matrix.target, 'musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/work:ro" \
            -e PROJECT_VERSION="$PROJECT_VERSION" \
            -e NIF_PATH="/work/$(find raw-smoke -type f -print -quit)" \
            hexpm/elixir:1.20.1-erlang-27.3.4.13-alpine-3.22.5 \
            sh -c 'apk add --no-cache libgcc >/dev/null && elixir /work/bin/smoke_precompiled_nif.exs'

      - name: Attest artifact
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.artifact.outputs.file-path }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.file-name }}
          path: ${{ steps.artifact.outputs.file-path }}
          if-no-files-found: error

      - name: Publish exact-tag artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.artifact.outputs.file-path }}

  published-checksums-and-consumer:
    if: startsWith(github.ref, 'refs/tags/')
    needs: native
    runs-on: ubuntu-24.04
    env:
      HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27.3"
          elixir-version: "1.20.1"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - run: mix deps.get
      - name: Download published bytes and produce checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*@version "\([^"]*\)".*/\1/p' mix.exs | head -1)
          test -n "$VERSION"
          mkdir published
          gh release download "${GITHUB_REF_NAME}" --dir published --pattern '*.tar.gz'
          cat > expected <<EOF
          librusty_opus_native-v${VERSION}-nif-2.15-aarch64-apple-darwin.so.tar.gz
          librusty_opus_native-v${VERSION}-nif-2.15-aarch64-unknown-linux-gnu.so.tar.gz
          librusty_opus_native-v${VERSION}-nif-2.15-aarch64-unknown-linux-musl.so.tar.gz
          librusty_opus_native-v${VERSION}-nif-2.15-x86_64-apple-darwin.so.tar.gz
          librusty_opus_native-v${VERSION}-nif-2.15-x86_64-unknown-linux-gnu.so.tar.gz
          librusty_opus_native-v${VERSION}-nif-2.15-x86_64-unknown-linux-musl.so.tar.gz
          EOF
          (cd published && ls *.tar.gz | sort) > actual
          diff -u expected actual
          (cd published && sha256sum *.tar.gz > SHA256SUMS)
          gh release upload "${GITHUB_REF_NAME}" published/SHA256SUMS --clobber
      - name: Generate RustlerPrecompiled checksum from published artifacts
        run: |
          RUSTY_OPUS_BUILD=1 mix compile
          mix rustler_precompiled.download RustyOpus.Native --all --print
          test -s checksum-Elixir.RustyOpus.Native.exs
      - name: Clean no-Rust consumer and release
        run: scripts/clean_consumer.sh --precompiled
      - name: Build and inspect Hex candidate
        run: scripts/package_check.sh
      - name: Publish Hex package
        if: env.HEX_API_KEY != ''
        run: mix hex.publish --yes
